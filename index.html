  <script>
    (function () {
      try {
        var theme = localStorage.getItem('bitacora_theme');

        var ap = { paletteKey: 'papel', accent: '#FF8FAE' };
        var apRaw = localStorage.getItem('bitacora_apariencia');
        if (apRaw) { try { var parsed = JSON.parse(apRaw); if (parsed && typeof parsed === 'object') ap = parsed; } catch (e) { } }
        var PAL = {
          papel: { light: { paper: '#FFF6F8', paper2: '#FFE8ED', ink: '#5B4B63', card: '#FFFFFF' }, dark: { paper: '#241B2E', paper2: '#2E2339', ink: '#F5E9F0', card: '#2E2339' } },
          pizarra: { light: { paper: '#F6F1FC', paper2: '#ECE1F8', ink: '#52456B', card: '#FFFFFF' }, dark: { paper: '#241E30', paper2: '#2C2440', ink: '#F0E9FA', card: '#2C2440' } },
          menta: { light: { paper: '#F0FBF6', paper2: '#DFF5EA', ink: '#2E5C48', card: '#FFFFFF' }, dark: { paper: '#16261F', paper2: '#1D3327', ink: '#E3F5EC', card: '#1D3327' } },
          arena: { light: { paper: '#FFF3EA', paper2: '#FFE3CC', ink: '#6B4A2E', card: '#FFFFFF' }, dark: { paper: '#2E2013', paper2: '#3A2A19', ink: '#FBE7D2', card: '#3A2A19' } }
        };
        var pal = (PAL[ap.paletteKey] || PAL.papel)[theme];
        function hexToRgb(hex) {
          hex = hex.replace('#', '');
          if (hex.length === 3) hex = hex.split('').map(function (c) { return c + c; }).join('');
          var num = parseInt(hex, 16);
          return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
        }
        function rgbaStr(hex, a) { var c = hexToRgb(hex); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
        function mixHex(h1, h2, w) {
          var c1 = hexToRgb(h1), c2 = hexToRgb(h2);
          var r = Math.round(c1[0] * (1 - w) + c2[0] * w), g = Math.round(c1[1] * (1 - w) + c2[1] * w), b = Math.round(c1[2] * (1 - w) + c2[2] * w);
          return 'rgb(' + r + ',' + g + ',' + b + ')';
        }
        var baseAccent = ap.accent || '#FF8FAE';
        var accent = theme === 'dark' ? mixHex(baseAccent, '#ffffff', 0.22) : baseAccent;
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        var s = root.style;
        s.setProperty('--paper', pal.paper);
        s.setProperty('--paper-2', pal.paper2);
        s.setProperty('--ink', pal.ink);
        s.setProperty('--card', pal.card);
        s.setProperty('--ink-soft', rgbaStr(pal.ink, 0.62));
        s.setProperty('--line', rgbaStr(pal.ink, 0.14));
        s.setProperty('--line-strong', rgbaStr(pal.ink, 0.28));
        s.setProperty('--gold', accent);
        s.setProperty('--gold-dark', mixHex(accent, '#000000', theme === 'dark' ? 0.30 : 0.22));
        s.setProperty('--gold-soft', mixHex(accent, theme === 'dark' ? '#000000' : '#ffffff', 0.35));
        s.setProperty('--gold-bg', rgbaStr(accent, 0.13));
        s.background = pal.paper;
      } catch (e) { }
    })();
  </script>

  <style>
    :root {
      --paper: #FFF6F8;
      --paper-2: #FFE8ED;
      --ink: #5B4B63;
      --ink-soft: #9689A0;
      --line: rgba(91, 75, 99, 0.10);
      --line-strong: rgba(91, 75, 99, 0.20);
      --gold: #FF8FAE;
      --gold-dark: #DB5E80;
      --gold-soft: #FFB8CB;
      --gold-bg: rgba(255, 143, 174, 0.16);
      --good: #2FB682;
      --bad: #FF6B85;
      --card: #FFFFFF;
      --shadow-soft: 0 10px 22px -12px rgba(91, 75, 99, .24), 0 2px 6px -2px rgba(91, 75, 99, .12);
      --shadow-press: 0 2px 6px -2px rgba(91, 75, 99, .20);
      --radius: 24px;
    }

    [data-theme="dark"] {
      --paper: #241B2E;
      --paper-2: #2E2339;
      --ink: #F5E9F0;
      --ink-soft: #B7A8C2;
      --line: rgba(245, 233, 240, 0.10);
      --line-strong: rgba(245, 233, 240, 0.20);
      --gold: #FF9DB8;
      --gold-dark: #D9647F;
      --gold-soft: #8C4C63;
      --gold-bg: rgba(255, 157, 184, 0.18);
      --good: #5FD9A4;
      --bad: #FF93A8;
      --card: #2E2339;
      --shadow-soft: 0 12px 24px -10px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .35);
      --shadow-press: 0 2px 6px -2px rgba(0, 0, 0, .45);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overscroll-behavior: none;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Nunito', sans-serif;
      transition: background .25s ease, color .25s ease;
      overscroll-behavior: none;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      position: relative;
      overscroll-behavior: none;
    }

    header.topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: max(18px, env(safe-area-inset-top)) 20px 14px;
      background: linear-gradient(var(--paper) 65%, transparent);
      backdrop-filter: blur(6px);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .brand .mark {
      font-family: 'Baloo 2', sans-serif;
      font-weight: 700;
      font-size: 16px;
      background: var(--gold);
      color: #fff;
      box-shadow: 0 4px 8px -3px rgba(91, 75, 99, .4);
      border-radius: 999px;
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transform: translateY(2px);
    }

    .brand h1 {
      font-family: 'Baloo 2', serif;
      font-weight: 700;
      font-size: 21px;
      margin: 0;
      letter-spacing: -0.01em;
    }

    .brand .sub {
      font-size: 11px;
      color: var(--ink-soft);
      letter-spacing: .04em;
      margin-left: 2px;
    }

    .theme-toggle {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: none;
      background: var(--card);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--ink);
      box-shadow: var(--shadow-soft);
      transition: transform .15s cubic-bezier(.34, 1.56, .64, 1);
    }

    .theme-toggle:active {
      transform: scale(.88);
    }

    .theme-toggle svg {
      width: 18px;
      height: 18px;
    }

    main {
      flex: 1;
      padding: 4px 20px 100px;
      position: relative;
      z-index: 1;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
      animation: popIn .32s cubic-bezier(.32, 1, .4, 1);
    }

    @keyframes fadein {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: translateY(10px) scale(.98);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes bounceIn {
      0% {
        transform: scale(1);
      }

      35% {
        transform: scale(1.16);
      }

      60% {
        transform: scale(.95);
      }

      100% {
        transform: scale(1);
      }
    }

    @keyframes wiggle {

      0%,
      100% {
        transform: rotate(0deg);
      }

      25% {
        transform: rotate(-3deg);
      }

      75% {
        transform: rotate(3deg);
      }
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Nunito', sans-serif;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: .01em;
      color: var(--gold);
      background: var(--gold-bg);
      padding: 5px 13px 5px 10px;
      border-radius: 999px;
      margin: 22px 0 10px;
    }

    .eyebrow::before {
      content: "";
      width: 9px;
      height: 9px;
      background: var(--gold);
      flex-shrink: 0;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    }

    .eyebrow:first-child {
      margin-top: 6px;
    }

    .hero {
      background: var(--card);
      border-radius: 28px;
      padding: 24px 22px 22px;
      margin-top: 22px;
      box-shadow: var(--shadow-soft);
      position: relative;
      overflow: visible;
    }

    .hero-mascot {
      position: absolute;
      top: -16px;
      right: 16px;
      width: 48px;
      height: 48px;
      color: var(--gold);
      filter: drop-shadow(0 4px 6px rgba(91, 75, 99, .20));
      pointer-events: none;
      z-index: 2;
    }

    .hero .goal-label {
      font-size: 12.5px;
      color: var(--ink-soft);
      font-weight: 700;
    }

    .hero .goal-amt {
      font-family: 'Baloo 2', sans-serif;
      font-size: 33px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 3px 0 16px;
    }

    .hero .goal-amt .of {
      font-size: 16px;
      color: var(--ink-soft);
      font-weight: 700;
    }

    .stitch-wrap {
      position: relative;
    }

    .stitch {
      --p: 0%;
      height: 12px;
      border-radius: 999px;
      background: var(--paper-2);
      border: 2px solid var(--line);
      position: relative;
      overflow: hidden;
    }

    .stitch::after {
      content: "";
      position: absolute;
      inset: 0;
      width: var(--p);
      background: linear-gradient(90deg, var(--gold-soft), var(--gold));
      border-radius: 999px;
      background-image: linear-gradient(90deg, var(--gold-soft), var(--gold)), repeating-linear-gradient(90deg, rgba(255, 255, 255, .4) 0 3px, transparent 3px 8px);
      background-blend-mode: normal, overlay;
      transition: width .4s cubic-bezier(.32, 1, .4, 1);
    }

    .stitch-star {
      position: absolute;
      right: -4px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      color: var(--gold-soft);
      filter: drop-shadow(0 2px 3px rgba(91, 75, 99, .25));
    }

    .hero .foot-row {
      display: flex;
      justify-content: space-between;
      margin-top: 11px;
      font-size: 12px;
      color: var(--ink-soft);
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 600;
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .mini {
      background: var(--card);
      border-radius: 20px;
      padding: 14px 15px;
      box-shadow: var(--shadow-soft);
    }

    .mini .k {
      font-size: 11px;
      color: var(--ink-soft);
      font-weight: 800;
      letter-spacing: .02em;
    }

    .mini .v {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 19px;
      font-weight: 700;
      margin-top: 4px;
    }

    .mini .v.neg {
      color: var(--bad);
    }

    .mini .v.pos {
      color: var(--good);
    }

    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 17px 17px 15px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-soft);
      position: relative;
    }

    .card h3 {
      font-family: 'Baloo 2', sans-serif;
      font-size: 16px;
      margin: 0 0 10px;
      font-weight: 700;
    }

    .catbar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 11px 0;
      font-size: 13px;
    }

    .catbar-row .lbl {
      width: 96px;
      flex-shrink: 0;
      min-width: 0;
      color: var(--ink-soft);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .catbar-row .lbl .lbl-icon {
      flex-shrink: 0;
    }

    .catbar-row .lbl .lbl-text {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .catbar-track {
      flex: 1;
      height: 9px;
      background: var(--paper-2);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--line);
    }

    .catbar-fill {
      height: 100%;
      background: var(--gold);
      border-radius: 999px;
      transition: width .4s cubic-bezier(.32, 1, .4, 1);
    }

    .catbar-amt {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12.5px;
      font-weight: 600;
      width: 56px;
      text-align: right;
      flex-shrink: 0;
    }

    .list-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 2px;
      border-bottom: 1.5px solid var(--line);
    }

    .list-item:last-child {
      border-bottom: none;
    }

    .li-click {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .li-icon {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      background: var(--gold);
      color: #fff;
      box-shadow: 0 3px 8px -3px rgba(91, 75, 99, .35);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 16px;
    }

    .li-mid {
      flex: 1;
      min-width: 0;
    }

    .li-mid .t1 {
      font-size: 14.5px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .li-mid .t2 {
      font-size: 12px;
      color: var(--ink-soft);
      margin-top: 1px;
      font-weight: 600;
    }

    .li-amt {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 14.5px;
      font-weight: 700;
      text-align: right;
      flex-shrink: 0;
    }

    .li-amt.bad {
      color: var(--bad);
    }

    .li-amt.good {
      color: var(--good);
    }

    .li-del {
      background: none;
      border: none;
      color: var(--ink-soft);
      opacity: .55;
      padding: 4px;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform .15s cubic-bezier(.34, 1.56, .64, 1);
    }

    .li-del svg {
      width: 15px;
      height: 15px;
    }

    .li-del:active {
      opacity: 1;
      transform: scale(.82) rotate(-8deg);
    }

    .li-order-btn {
      background: none;
      border: none;
      color: var(--ink-soft);
      padding: 4px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      transition: transform .12s ease;
    }

    .li-order-btn:active {
      color: var(--gold);
      transform: scale(.82);
    }

    .li-order-btn:disabled {
      opacity: .2;
      pointer-events: none;
    }

    .tag {
      display: inline-block;
      font-size: 10.5px;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--gold-bg);
      color: var(--gold);
      margin-right: 6px;
      font-weight: 800;
    }

    .tag.hist {
      background: var(--paper-2);
      color: var(--ink-soft);
    }

    .empty {
      text-align: center;
      padding: 34px 10px;
      color: var(--ink-soft);
      font-size: 13.5px;
      font-weight: 700;
    }

    .empty .big {
      font-size: 30px;
      margin-bottom: 6px;
    }

    /* HISTORIAL COLAPSABLE */
    .hist-row {
      border-bottom: 1.5px solid var(--line);
    }

    .hist-row:last-child {
      border-bottom: none;
    }

    .hist-toggle {
      width: 100%;
      background: none;
      border: none;
      padding: 13px 2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      text-align: left;
      font-family: 'Nunito', sans-serif;
      color: var(--ink);
    }

    .hist-toggle .t1 {
      font-size: 14.5px;
      font-weight: 800;
    }

    .hist-toggle .ahorro {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13.5px;
      font-weight: 700;
    }

    .hist-chevron {
      width: 16px;
      height: 16px;
      color: var(--ink-soft);
      flex-shrink: 0;
      transition: transform .25s cubic-bezier(.34, 1.56, .64, 1);
    }

    .hist-chevron.open {
      transform: rotate(180deg);
    }

    .hist-detail {
      padding: 0 2px 14px;
      animation: popIn .22s cubic-bezier(.32, 1, .4, 1);
    }

    /* SELECTOR DE ÍCONO DE CATEGORÍA */
    .icon-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .icon-swatch {
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: none;
      background: var(--paper-2);
      color: var(--ink-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      box-shadow: inset 0 2px 3px rgba(0, 0, 0, .07);
      transition: transform .15s cubic-bezier(.34, 1.56, .64, 1);
    }

    .icon-swatch:active {
      transform: scale(.86);
    }

    .icon-swatch.on {
      background: var(--gold);
      color: #fff;
      box-shadow: 0 3px 8px -3px rgba(91, 75, 99, .4);
      animation: bounceIn .35s cubic-bezier(.34, 1.56, .64, 1);
    }

    /* FORMS */
    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--ink-soft);
      margin-bottom: 6px;
      font-weight: 800;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 16px;
      border: 2px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      font-size: 15px;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, .06);
      transition: box-shadow .15s ease, border-color .15s ease;
    }

    .field input:focus,
    .field select:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, .06), 0 0 0 4px var(--gold-bg);
    }

    .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .seg {
      display: flex;
      gap: 6px;
      background: var(--paper-2);
      padding: 5px;
      border-radius: 999px;
    }

    .seg button {
      flex: 1;
      padding: 10px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: var(--ink-soft);
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      transition: transform .12s ease;
    }

    .seg button.on {
      background: var(--gold);
      color: var(--card);
      box-shadow: 0 3px 8px -2px rgba(91, 75, 99, .4);
      animation: bounceIn .3s cubic-bezier(.34, 1.56, .64, 1);
    }

    .seg button:active {
      transform: scale(.94);
    }

    .btn {
      width: 100%;
      padding: 15px;
      border-radius: 20px;
      border: none;
      background: var(--gold);
      color: var(--card);
      font-size: 15px;
      font-weight: 800;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      margin-top: 4px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 5px 0 var(--gold-dark), 0 10px 16px -8px rgba(91, 75, 99, .45);
      text-shadow: 0 1px 2px rgba(0, 0, 0, .15);
      transition: transform .12s cubic-bezier(.34, 1.56, .64, 1), box-shadow .12s ease;
      transform: translateY(0);
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 1px 0 var(--gold-dark), 0 3px 8px -4px rgba(91, 75, 99, .4);
    }

    .btn.ghost {
      background: transparent;
      border: 2.5px solid var(--line-strong);
      color: var(--ink);
      font-weight: 800;
      box-shadow: none;
      text-shadow: none;
    }

    .btn.ghost:active {
      transform: scale(.97);
      box-shadow: none;
    }

    .btn.danger {
      background: transparent;
      border: 2.5px solid var(--bad);
      color: var(--bad);
      font-weight: 800;
      box-shadow: none;
      text-shadow: none;
    }

    .btn.danger:active {
      transform: scale(.97);
      box-shadow: none;
    }

    .fab {
      position: fixed;
      z-index: 30;
      right: 20px;
      bottom: 96px;
      width: 58px;
      height: 58px;
      border-radius: 999px;
      background: var(--gold);
      color: var(--card);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 5px 0 var(--gold-dark), 0 12px 20px -8px rgba(91, 75, 99, .5);
      left: 50%;
      margin-left: min(200px, calc(50vw - 40px));
      transition: transform .12s cubic-bezier(.34, 1.56, .64, 1), box-shadow .12s ease;
    }

    .fab:active {
      transform: translateY(4px) scale(.96);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 1px 0 var(--gold-dark), 0 4px 10px -4px rgba(91, 75, 99, .4);
    }

    .fab svg {
      width: 25px;
      height: 25px;
    }

    /* MODAL */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(36, 26, 20, .55);
      z-index: 40;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .sheet-backdrop.show {
      display: flex;
    }

    .sheet {
      width: 100%;
      max-width: 480px;
      background: var(--paper);
      border-radius: 32px 32px 0 0;
      padding: 18px 20px max(20px, env(safe-area-inset-bottom));
      max-height: 88vh;
      overflow-y: auto;
      animation: sheetUp .38s cubic-bezier(.2, 1, .32, 1);
      box-shadow: 0 -12px 30px -10px rgba(91, 75, 99, .35);
    }

    @keyframes slideup {
      from {
        transform: translateY(30px);
        opacity: 0;
      }

      to {
        transform: none;
        opacity: 1;
      }
    }

    @keyframes sheetUp {
      0% {
        transform: translateY(60px);
        opacity: 0;
      }

      65% {
        transform: translateY(-8px);
        opacity: 1;
      }

      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .sheet-handle {
      width: 42px;
      height: 5px;
      background: var(--line-strong);
      border-radius: 999px;
      margin: 0 auto 14px;
    }

    .sheet h2 {
      font-family: 'Baloo 2', sans-serif;
      font-size: 19px;
      margin: 0;
      font-weight: 700;
    }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .sheet-x {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: none;
      background: var(--card);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: var(--shadow-soft);
      transition: transform .15s cubic-bezier(.34, 1.56, .64, 1);
    }

    .sheet-x:active {
      transform: scale(.85) rotate(90deg);
    }

    .sheet-x svg {
      width: 16px;
      height: 16px;
    }

    .icon {
      display: inline-flex;
      vertical-align: middle;
    }

    .icon svg {
      width: 100%;
      height: 100%;
      stroke-width: 2.3;
    }

    /* APPEARANCE */
    .palette-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 18px;
      border: 2px solid transparent;
      cursor: pointer;
      margin-bottom: 9px;
      background: var(--paper-2);
      transition: transform .12s ease;
    }

    .palette-card:active {
      transform: scale(.98);
    }

    .palette-card.on {
      border-color: var(--gold);
      background: var(--gold-bg);
    }

    .palette-dots {
      display: flex;
      flex-shrink: 0;
    }

    .palette-dots span {
      width: 19px;
      height: 19px;
      border-radius: 50%;
      margin-left: -7px;
      border: 2px solid var(--card);
      display: block;
    }

    .palette-dots span:first-child {
      margin-left: 0;
    }

    .palette-card .pname {
      font-size: 14px;
      font-weight: 800;
    }

    .swatch-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .swatch {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      cursor: pointer;
      border: none;
      padding: 0;
      flex-shrink: 0;
      box-shadow: inset 0 -3px 5px rgba(0, 0, 0, .15), inset 0 2px 2px rgba(255, 255, 255, .3), 0 3px 6px -2px rgba(91, 75, 99, .35);
      transition: transform .15s cubic-bezier(.34, 1.56, .64, 1);
    }

    .swatch:active {
      transform: scale(.85);
    }

    .swatch.on {
      box-shadow: inset 0 -3px 5px rgba(0, 0, 0, .15), inset 0 2px 2px rgba(255, 255, 255, .3), 0 0 0 3px var(--card), 0 0 0 5px var(--ink);
      animation: bounceIn .3s cubic-bezier(.34, 1.56, .64, 1);
    }

    input[type="color"].swatch {
      background: none;
    }

    .swatch-custom {
      background: conic-gradient(from 180deg, #E5484D, #F5A623, #F5D90A, #7CE07C, #12B5CB, #5B5BD6, #B34FCB, #E5484D);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .swatch-custom.on {
      box-shadow: 0 0 0 3px var(--card), 0 0 0 5px var(--ink);
    }

    /* SELECTOR DE COLOR PERSONALIZADO */
    .sv-square {
      position: relative;
      width: 100%;
      height: 150px;
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid var(--line-strong);
      touch-action: none;
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      background-image: linear-gradient(to top, #000, rgba(0, 0, 0, 0)), linear-gradient(to right, #fff, rgba(255, 255, 255, 0));
    }

    .sv-cursor {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 3px solid #fff;
      box-shadow: 0 0 0 1.5px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .35);
      transform: translate(-50%, -50%);
      pointer-events: none;
      left: 0%;
      top: 0%;
    }

    .hue-slider {
      position: relative;
      width: 100%;
      height: 20px;
      border-radius: 999px;
      margin-top: 14px;
      touch-action: none;
      cursor: pointer;
      border: 2px solid var(--line-strong);
      box-shadow: var(--shadow-soft);
      background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00);
    }

    .hue-cursor {
      position: absolute;
      top: 50%;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 3px solid #fff;
      box-shadow: 0 0 0 1.5px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .35);
      transform: translate(-50%, -50%);
      pointer-events: none;
      left: 0%;
    }

    /* NAV */
    nav.tabbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 25;
      max-width: 480px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 26px 26px 0 0;
      display: flex;
      padding: 10px 6px max(10px, env(safe-area-inset-bottom));
      box-shadow: 0 -10px 26px -12px rgba(91, 75, 99, .35);
    }

    nav.tabbar button {
      flex: 1;
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      color: var(--ink-soft);
      padding: 7px 2px;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      transition: transform .12s ease;
    }

    nav.tabbar button:active {
      transform: scale(.9);
    }

    nav.tabbar button svg {
      width: 21px;
      height: 21px;
    }

    nav.tabbar button span {
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: .01em;
    }

    nav.tabbar button.on {
      color: var(--gold);
    }

    nav.tabbar button.on svg {
      animation: bounceIn .4s cubic-bezier(.34, 1.56, .64, 1);
    }

    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(20px) scale(.9);
      background: var(--ink);
      color: var(--paper);
      padding: 12px 20px;
      border-radius: 999px;
      font-size: 13.5px;
      z-index: 60;
      opacity: 0;
      transition: all .3s cubic-bezier(.34, 1.56, .64, 1);
      pointer-events: none;
      font-weight: 800;
      box-shadow: 0 8px 20px -6px rgba(0, 0, 0, .35);
    }

    [data-theme="dark"] .toast {
      background: var(--gold);
      color: var(--paper-2);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    /* TUTORIAL DE BIENVENIDA */
    .tutorial-overlay {
      position: fixed;
      inset: 0;
      z-index: 70;
      background: var(--paper);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .tutorial-overlay.show {
      display: flex;
    }

    .tutorial-card {
      width: 100%;
      max-width: 360px;
      text-align: center;
      animation: popIn .35s cubic-bezier(.32, 1, .4, 1);
    }

    .tutorial-icon {
      width: 92px;
      height: 92px;
      border-radius: 999px;
      background: var(--gold);
      color: #fff;
      box-shadow: var(--shadow-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 26px;
    }

    .tutorial-title {
      font-family: 'Baloo 2', sans-serif;
      font-size: 23px;
      font-weight: 700;
      margin: 0 0 12px;
    }

    .tutorial-text {
      font-size: 14.5px;
      color: var(--ink-soft);
      line-height: 1.65;
      font-weight: 600;
    }

    .tutorial-dots {
      display: flex;
      gap: 7px;
      justify-content: center;
      margin: 30px 0 26px;
    }

    .tutorial-dots span {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--line-strong);
      transition: all .25s cubic-bezier(.34, 1.56, .64, 1);
    }

    .tutorial-dots span.on {
      background: var(--gold);
      width: 24px;
    }

    .tutorial-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .tutorial-link {
      background: none;
      border: none;
      color: var(--ink-soft);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      padding: 10px 4px;
    }

    .tutorial-link.hidden {
      visibility: hidden;
    }

    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>

  </div>

  <div class="sheet-backdrop" id="sheetBackdrop">

  </div>

  <script>
    function svg(inner, extra) { return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${extra || ''}>${inner}</svg>`; }
    const ICONS = {
      comida: svg('<path d="M4 3v6a2 2 0 002 2 2 2 0 002-2V3M6 11v10M10 3v10c0 1.4-1.3 1.9-3 2M17 3c-2 0-3 2-3 5s1 4.5 3 4.5V21"/>'),
      transporte: svg('<path d="M4 17V12l1.6-5h12.8L20 12v5"/><path d="M4 17h16M7 17a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0zM20 17a1.5 1.5 0 11-3 0 1.5 1.5 0 013 0z"/>'),

      educacion: svg('<path d="M4 5.5c3-1 6-1 8 0v14c-2-1-5-1-8 0v-14z"/><path d="M20 5.5c-3-1-6-1-8 0v14c2-1 5-1 8 0v-14z"/>'),
      otros: svg('<path d="M12 3l1.9 5.6L19.5 10l-5.6 1.4L12 17l-1.9-5.6L4.5 10l5.6-1.4L12 3z"/>'),
      ropa: svg('<path d="M8 4L4.5 7l1.8 2.7L8 8.5V21h8V8.5l1.7 1.2L19.5 7 16 4l-2 1.6a2.2 2.2 0 01-4 0z"/>'),
      mascota: svg('<ellipse cx="12" cy="16" rx="5.3" ry="4.3" fill="currentColor" stroke="none"/><circle cx="5.7" cy="9.8" r="2.2" fill="currentColor" stroke="none"/><circle cx="10.2" cy="5.8" r="2.2" fill="currentColor" stroke="none"/><circle cx="14.4" cy="5.6" r="2.2" fill="currentColor" stroke="none"/><circle cx="18.3" cy="9.4" r="2.2" fill="currentColor" stroke="none"/>'),
      viaje: svg('<path d="M21 15.5v-2l-8-5V4a1.5 1.5 0 00-3 0v4.5l-8 5v2l8-2.5V19l-2.5 1.7V22l4-.9 4 .9v-1.3L14 19v-6z"/>'),
      tecnologia: svg('<rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M2 19.5h20"/>'),
      telefono: svg('<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>'),
      belleza: svg('<path d="M12 2.5l1.9 5.8L20 10l-6.1 1.7L12 17.5l-1.9-5.8L4 10l6.1-1.7L12 2.5z"/><path d="M19 15.5l.8 2.3 2.2.7-2.2.7-.8 2.3-.8-2.3-2.2-.7 2.2-.7z"/>'),
      deporte: svg('<path d="M4.5 9v6M7 6.5v11M17 6.5v11M19.5 9v6"/><path d="M7 12h10"/>'),
      bebe: svg('<circle cx="12" cy="5.3" r="2.3"/><path d="M9 7.3a6 6 0 106 0"/><ellipse cx="12" cy="15.3" rx="6" ry="4.2"/>'),

    function icon(name, size) { return `<span class="icon" style="width:${size || 16}px;height:${size || 16}px;">${ICONS[name]}</span>`; }

    /* paleta de colores*/
    function hexToRgb(hex) {
      hex = hex.replace('#', '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const num = parseInt(hex, 16);
      return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
    }
    function rgbaStr(hex, a) { const [r, g, b] = hexToRgb(hex); return `rgba(${r},${g},${b},${a})`; }
    function mixHex(hex1, hex2, weight) {
      const c1 = hexToRgb(hex1), c2 = hexToRgb(hex2);
      const r = Math.round(c1[0] * (1 - weight) + c2[0] * weight);
      const g = Math.round(c1[1] * (1 - weight) + c2[1] * weight);
      const b = Math.round(c1[2] * (1 - weight) + c2[2] * weight);
      return `rgb(${r},${g},${b})`;
    }
    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
      let h = 0;
      if (d !== 0) {
        if (max === r) h = ((g - b) / d) % 6;
        else if (max === g) h = (b - r) / d + 2;
        else h = (r - g) / d + 4;
        h *= 60;
        if (h < 0) h += 360;
      }
      const s = max === 0 ? 0 : d / max;
      return { h, s: s * 100, v: max * 100 };
    }
    function hexToHsv(hex) { const [r, g, b] = hexToRgb(hex); return rgbToHsv(r, g, b); }
    function hsvToRgb(h, s, v) {
      s /= 100; v /= 100;
      const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
      let r = 0, g = 0, b = 0;
      if (h < 60) { r = c; g = x; b = 0; } else if (h < 120) { r = x; g = c; b = 0; } else if (h < 180) { r = 0; g = c; b = x; }
      else if (h < 240) { r = 0; g = x; b = c; } else if (h < 300) { r = x; g = 0; b = c; } else { r = c; g = 0; b = x; }
      return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
    }
    function rgbToHex(r, g, b) { return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join(''); }
    function hsvToHex(h, s, v) { const [r, g, b] = hsvToRgb(h, s, v); return rgbToHex(r, g, b); }
    const PALETTES = [
      { key: 'papel', name: 'Algodón', light: { paper: '#FFF6F8', paper2: '#FFE8ED', ink: '#5B4B63', card: '#FFFFFF' }, dark: { paper: '#241B2E', paper2: '#2E2339', ink: '#F5E9F0', card: '#2E2339' } },
      { key: 'pizarra', name: 'Lavanda', light: { paper: '#F6F1FC', paper2: '#ECE1F8', ink: '#52456B', card: '#FFFFFF' }, dark: { paper: '#241E30', paper2: '#2C2440', ink: '#F0E9FA', card: '#2C2440' } },
      { key: 'menta', name: 'Menta', light: { paper: '#F0FBF6', paper2: '#DFF5EA', ink: '#2E5C48', card: '#FFFFFF' }, dark: { paper: '#16261F', paper2: '#1D3327', ink: '#E3F5EC', card: '#1D3327' } },
      { key: 'arena', name: 'Durazno', light: { paper: '#FFF3EA', paper2: '#FFE3CC', ink: '#6B4A2E', card: '#FFFFFF' }, dark: { paper: '#2E2013', paper2: '#3A2A19', ink: '#FBE7D2', card: '#3A2A19' } }
    ];
    const ACCENTS = [
      { key: 'chicle', hex: '#FF8FAE' },
      { key: 'durazno', hex: '#FFAB7A' },
      { key: 'limón', hex: '#F4C542' },
      { key: 'menta', hex: '#4ECDA0' },
      { key: 'turquesa', hex: '#45D0C6' },
      { key: 'cielo', hex: '#6FB3F2' },
      { key: 'lila', hex: '#9B93F2' },
      { key: 'lavanda', hex: '#C89BF0' },
      { key: 'orquídea', hex: '#E88FDB' },
      { key: 'fresa', hex: '#FF7FA0' },
      { key: 'coral', hex: '#FF7A6E' },
      { key: 'nube', hex: '#9CA3B5' }
    ];
    function loadAppearance() {
      try {
        const raw = localStorage.getItem('bitacora_apariencia');
        if (raw) return JSON.parse(raw);
      } catch (e) { }
      return { paletteKey: 'papel', accent: '#FF8FAE' };
    }
    let appearance = loadAppearance();
    function saveAppearance() { localStorage.setItem('bitacora_apariencia', JSON.stringify(appearance)); }
    function applyAppearance() {
      const theme = document.body.getAttribute('data-theme');
      const pal = (PALETTES.find(p => p.key === appearance.paletteKey) || PALETTES[0])[theme];
      const root = document.body.style;
      root.setProperty('--paper', pal.paper);
      root.setProperty('--paper-2', pal.paper2);
      root.setProperty('--ink', pal.ink);
      root.setProperty('--card', pal.card);
      root.setProperty('--ink-soft', rgbaStr(pal.ink, 0.62));
      root.setProperty('--line', rgbaStr(pal.ink, 0.14));
      root.setProperty('--line-strong', rgbaStr(pal.ink, 0.28));
      const baseAccent = appearance.accent || '#FF8FAE';
      const accent = theme === 'dark' ? mixHex(baseAccent, '#ffffff', 0.22) : baseAccent;
      root.setProperty('--gold', accent);
      root.setProperty('--gold-dark', mixHex(accent, '#000000', theme === 'dark' ? 0.30 : 0.22));
      root.setProperty('--gold-soft', mixHex(accent, theme === 'dark' ? '#000000' : '#ffffff', 0.35));
      root.setProperty('--gold-bg', rgbaStr(accent, 0.13));
      const themeMeta = document.querySelector('meta[name="theme-color"]');
      if (themeMeta) themeMeta.setAttribute('content', pal.paper);
    }
    function selectPalette(key) { appearance.paletteKey = key; saveAppearance(); applyAppearance(); renderAjustes(); }
    let mostrarPickerCustom = false;
    let pickerColorState = { h: 0, s: 100, v: 100 };
    function selectAccent(hex) { appearance.accent = hex; saveAppearance(); applyAppearance(); renderAjustes(); }
    function toggleColorPickerCustom() {
      mostrarPickerCustom = !mostrarPickerCustom;
      if (mostrarPickerCustom) { pickerColorState = hexToHsv(appearance.accent || '#FF8FAE'); }
      renderAjustes();
    }
    function aplicarColorPersonalizado(hex) {
      appearance.accent = hex;
      saveAppearance(); applyAppearance();
      const preview = document.getElementById('accentPreviewBox');
      if (preview) preview.style.background = hex;
      const hexInput = document.getElementById('customColorHexInput');
      if (hexInput && document.activeElement !== hexInput) hexInput.value = hex.toUpperCase();
      document.querySelectorAll('#accentSwatchRow .swatch[data-hex]').forEach(b => {
        b.classList.toggle('on', (b.dataset.hex || '').toLowerCase() === hex.toLowerCase());
      });
      const custom = document.getElementById('customColorSwatchBtn');
      if (custom) custom.classList.toggle('on', !ACCENTS.some(a => a.hex.toLowerCase() === hex.toLowerCase()));
    }
    function actualizarPickerUI() {
      const { h, s, v } = pickerColorState;
      const hex = hsvToHex(h, s, v);
      const square = document.getElementById('svSquare');
      const cursor = document.getElementById('svCursor');
      const hueCursor = document.getElementById('hueCursor');
      if (square) square.style.backgroundColor = 'hsl(' + h + ',100%,50%)';
      if (cursor) { cursor.style.left = s + '%'; cursor.style.top = (100 - v) + '%'; }
      if (hueCursor) { hueCursor.style.left = (h / 360 * 100) + '%'; hueCursor.style.backgroundColor = 'hsl(' + h + ',100%,50%)'; }
      aplicarColorPersonalizado(hex);
    }
    function wireColorPicker() {
      const square = document.getElementById('svSquare');
      const hueSlider = document.getElementById('hueSlider');
      if (square) {
        let dragging = false;
        const update = (e) => {
          const rect = square.getBoundingClientRect();
          const x = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
          const y = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
          pickerColorState.s = Math.round(x * 100);
          pickerColorState.v = Math.round((1 - y) * 100);
          actualizarPickerUI();
        };
        square.addEventListener('pointerdown', e => { dragging = true; square.setPointerCapture(e.pointerId); update(e); });
        square.addEventListener('pointermove', e => { if (dragging) update(e); });
        square.addEventListener('pointerup', () => { dragging = false; });
        square.addEventListener('pointercancel', () => { dragging = false; });
      }
      if (hueSlider) {
        let dragging = false;
        const update = (e) => {
          const rect = hueSlider.getBoundingClientRect();
          const x = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
          pickerColorState.h = Math.round(x * 360);
          actualizarPickerUI();
        };
        hueSlider.addEventListener('pointerdown', e => { dragging = true; hueSlider.setPointerCapture(e.pointerId); update(e); });
        hueSlider.addEventListener('pointermove', e => { if (dragging) update(e); });
        hueSlider.addEventListener('pointerup', () => { dragging = false; });
        hueSlider.addEventListener('pointercancel', () => { dragging = false; });
      }
      actualizarPickerUI();
    }
    function onCustomAccentHex(val) {
      let v = (val || '').trim();
      if (v && v[0] !== '#') v = '#' + v;
      const preview = document.getElementById('accentPreviewBox');
      if (preview && /^#[0-9a-fA-F]{6}$/.test(v)) preview.style.background = v;
      if (!/^#[0-9a-fA-F]{6}$/.test(v)) return;
      pickerColorState = hexToHsv(v);
      appearance.accent = v;
      saveAppearance(); applyAppearance();
      const square = document.getElementById('svSquare');
      const cursor = document.getElementById('svCursor');
      const hueCursor = document.getElementById('hueCursor');
      if (square) square.style.backgroundColor = 'hsl(' + pickerColorState.h + ',100%,50%)';
      if (cursor) { cursor.style.left = pickerColorState.s + '%'; cursor.style.top = (100 - pickerColorState.v) + '%'; }
      if (hueCursor) { hueCursor.style.left = (pickerColorState.h / 360 * 100) + '%'; hueCursor.style.backgroundColor = 'hsl(' + pickerColorState.h + ',100%,50%)'; }
      document.querySelectorAll('#accentSwatchRow .swatch[data-hex]').forEach(b => {
        b.classList.toggle('on', (b.dataset.hex || '').toLowerCase() === v.toLowerCase());
      });
      const custom = document.getElementById('customColorSwatchBtn');
      if (custom) custom.classList.toggle('on', !ACCENTS.some(a => a.hex.toLowerCase() === v.toLowerCase()));
    }

    /* DATA */
    const CATEGORIAS_INICIALES = ["Comida", "Transporte", "Servicios", "Vivienda", "Entretenimiento", "Salud", "Educación", "Otros"];
    const CAT_KEY = { Comida: "cupcake", Transporte: "transporte", Servicios: "servicios", Vivienda: "vivienda", Entretenimiento: "entretenimiento", Salud: "salud", Educación: "educacion", Otros: "otros" };
    const ICONOS_CATEGORIA_DISPONIBLES = ["cupcake", "comida", "transporte", "servicios", "vivienda", "entretenimiento", "salud", "educacion", "otros", "ropa", "mascota", "viaje", "tecnologia", "telefono", "belleza", "deporte", "bebe", "auto", "combustible", "suscripcion", "ahorro", "seguro", "musica", "cafe", "super", "dental", "herramientas", "trabajo", "cine", "internet", "agua", "impuestos", "juguetes", "limpieza", "llave", "inversion", "mueble", "gift", "flor", "oso"];
    function getCats() { return data.categorias || []; }
    function getCatIcon(nombre) {
      if (data.categoriaIconos && data.categoriaIconos[nombre]) return data.categoriaIconos[nombre];
      return CAT_KEY[nombre] || 'otros';
    }
    function normalizarCategorias(obj) {
      if (Array.isArray(obj.categorias) && obj.categorias.length) return obj.categorias;
      const custom = Array.isArray(obj.categoriasCustom) ? obj.categoriasCustom : [];
      return CATEGORIAS_INICIALES.concat(custom.filter(c => !CATEGORIAS_INICIALES.includes(c)));
    }
    function attrJs(s) {
      return String(s)
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    const DEFAULT_DATA = {
      ajustes: { sueldoQuincenal: 0, metaAhorro: 0, saldoInicialBanco: 0, saldoInicialEfectivo: 0, periodo: 'quincenal', ocultarSueldo: false },
      gastos: [],
      ingresos: [],
      categorias: [...CATEGORIAS_INICIALES],
      categoriaIconos: {}
    };

    let data = load();
    function load() {
      try {
        const raw = localStorage.getItem('bitacora_finanzas_v1');
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed.ajustes && !parsed.ajustes.periodo) parsed.ajustes.periodo = 'quincenal';
          if (parsed.ajustes && typeof parsed.ajustes.ocultarSueldo !== 'boolean') parsed.ajustes.ocultarSueldo = false;
          parsed.categorias = normalizarCategorias(parsed);
          if (!parsed.categoriaIconos || typeof parsed.categoriaIconos !== 'object') parsed.categoriaIconos = {};
          delete parsed.categoriasCustom;
          return parsed;
        }
      } catch (e) { }
      return JSON.parse(JSON.stringify(DEFAULT_DATA));
    }
    function save() {
      localStorage.setItem('bitacora_finanzas_v1', JSON.stringify(data));
    }
    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
    function money(n) {
      const neg = n < 0;
      const v = Math.abs(n).toLocaleString('es-SV', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      return (neg ? '-' : '') + '$' + v;
    }
    function todayStr() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }
    function fmtDate(s) {
      if (!s) return '';
      const d = new Date(s + 'T00:00:00');
      return d.toLocaleDateString('es-SV', { day: 'numeric', month: 'short' });
    }

    /* THEME */
    function applyTheme(t) {
      document.body.setAttribute('data-theme', t);
      localStorage.setItem('bitacora_theme', t);
      renderThemeBtn();
      applyAppearance();
    }
    function renderThemeBtn() {
      const paw = '<ellipse cx="12" cy="16" rx="5.3" ry="4.3"/><circle cx="5.7" cy="9.8" r="2.2"/><circle cx="10.2" cy="5.8" r="2.2"/><circle cx="14.4" cy="5.6" r="2.2"/><circle cx="18.3" cy="9.4" r="2.2"/>';
      document.getElementById('themeBtn').innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor" stroke="none">${paw}</svg>`;
    }
    (function initTheme() {
      const saved = localStorage.getItem('bitacora_theme');
      const t = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      applyTheme(t);
    })();
    document.getElementById('themeBtn').addEventListener('click', () => {
      applyTheme(document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    /* PERIODOS */
    function periodoLabelWord(periodo) { return periodo === 'mensual' ? 'mensual' : 'quincenal'; }
    function getPeriodRange(date, periodo) {
      const y = date.getFullYear(), m = date.getMonth();
      if (periodo === 'mensual') {
        const start = new Date(y, m, 1);
        const end = new Date(y, m + 1, 0);
        let label = start.toLocaleDateString('es-SV', { month: 'long', year: 'numeric' });
        label = label.charAt(0).toUpperCase() + label.slice(1);
        return { start, end, label };
      }
      const day = date.getDate();
      if (day <= 15) {
        const start = new Date(y, m, 1), end = new Date(y, m, 15);
        return { start, end, label: `1ª quincena · ${start.toLocaleDateString('es-SV', { day: 'numeric', month: 'short' })}–${end.toLocaleDateString('es-SV', { day: 'numeric', month: 'short' })}` };
      }
      const start = new Date(y, m, 16), end = new Date(y, m + 1, 0);
      return { start, end, label: `2ª quincena · ${start.toLocaleDateString('es-SV', { day: 'numeric', month: 'short' })}–${end.toLocaleDateString('es-SV', { day: 'numeric', month: 'short' })}` };
    }
    function inRange(fechaStr, start, end) {
      if (!fechaStr) return false;
      const d = new Date(fechaStr + 'T00:00:00');
      return d >= start && d <= end;
    }
    function periodKey(date, periodo) {
      return periodo === 'mensual' ? (date.getFullYear() + '-' + date.getMonth()) : (date.getFullYear() + '-' + date.getMonth() + '-' + (date.getDate() <= 15 ? 1 : 2));
    }
    function periodsCount(periodo) {
      const set = new Set();
      data.gastos.forEach(g => {
        if (!g.fecha) return;
        set.add(periodKey(new Date(g.fecha + 'T00:00:00'), periodo));
      });
      return set.size || 1;
    }
    function listAllPeriodKeys(periodo) {
      const set = new Set();
      data.gastos.forEach(g => { if (g.fecha) set.add(periodKey(new Date(g.fecha + 'T00:00:00'), periodo)); });
      data.ingresos.forEach(i => { if (i.fecha) set.add(periodKey(new Date(i.fecha + 'T00:00:00'), periodo)); });
      return set;
    }
    /* Historial */
    function buildPeriodHistory(periodo) {
      const map = {};
      function ensure(k, d) {
        if (!map[k]) map[k] = { start: d, ingresos: 0, cambioNeto: 0, gastado: 0, porCat: {}, gastosCount: 0 };
        if (d < map[k].start) map[k].start = d;
      }
      data.gastos.forEach(g => {
        if (!g.fecha) return;
        const d = new Date(g.fecha + 'T00:00:00');
        const k = periodKey(d, periodo);
        ensure(k, d);
        if (!g.hist) {
          map[k].cambioNeto -= g.monto;
          const neto = g.monto - (g.reintegro || 0);
          map[k].gastado += neto;
          map[k].porCat[g.cat] = (map[k].porCat[g.cat] || 0) + neto;
          map[k].gastosCount++;
        }
        if (g.reintegro > 0) { map[k].cambioNeto += g.reintegro; }
      });
      data.ingresos.forEach(i => {
        if (!i.fecha) return;
        const d = new Date(i.fecha + 'T00:00:00');
        const k = periodKey(d, periodo);
        ensure(k, d);
        map[k].ingresos += i.monto;
        map[k].cambioNeto += i.monto;
      });
      const currentKey = periodKey(new Date(), periodo);
      const keys = Object.keys(map).sort((a, b) => map[a].start - map[b].start);
      let running = data.ajustes.saldoInicialBanco + data.ajustes.saldoInicialEfectivo;
      const periods = [];
      keys.forEach(k => {
        running += map[k].cambioNeto;
        const range = getPeriodRange(map[k].start, periodo);
        const topCats = Object.entries(map[k].porCat).filter(([, v]) => v !== 0).sort((a, b) => b[1] - a[1]);
        periods.push({
          key: k, label: range.label, enCurso: k === currentKey,
          gastado: map[k].gastado, ingresado: map[k].ingresos, saldoCierre: running,
          ahorroNeto: map[k].ingresos - map[k].gastado,
          gastosCount: map[k].gastosCount,
          topCats
        });
      });
      return periods.reverse();
    }

    function computeTotals() {
      const a = data.ajustes;
      const periodo = a.periodo || 'quincenal';
      let banco = a.saldoInicialBanco, efectivo = a.saldoInicialEfectivo;
      data.gastos.forEach(g => {
        if (!g.hist) {
          if (g.cuenta === 'Banco') banco -= g.monto; else efectivo -= g.monto;
        }
        if (g.reintegro > 0 && g.cuentaReintegro) {
          if (g.cuentaReintegro === 'Banco') banco += g.reintegro; else efectivo += g.reintegro;
        }
      });
      data.ingresos.forEach(i => {
        if (i.cuenta === 'Banco') banco += i.monto; else efectivo += i.monto;
      });
      const totalAhorrado = banco + efectivo;
      const meta = a.metaAhorro;
      const restante = Math.max(0, meta - totalAhorrado);
      const pct = meta > 0 ? Math.min(100, (totalAhorrado / meta) * 100) : 0;

      // gasto neto total
      let gastoNetoTotal = 0;
      const porCat = {}; getCats().forEach(c => porCat[c] = 0);
      data.gastos.forEach(g => {
        const neto = g.monto - (g.reintegro || 0);
        gastoNetoTotal += neto;
        porCat[g.cat] = (porCat[g.cat] || 0) + neto;
      });

      // gasto real del periodo actual
      const periodRange = getPeriodRange(new Date(), periodo);
      let gastoPeriodoActual = 0;
      data.gastos.forEach(g => {
        if (inRange(g.fecha, periodRange.start, periodRange.end)) {
          gastoPeriodoActual += (g.monto - (g.reintegro || 0));
        }
      });
      const disponiblePeriodo = a.sueldoQuincenal - gastoPeriodoActual;

      const periodsN = periodsCount(periodo);
      const ahorroEstPeriodo = a.sueldoQuincenal - (data.gastos.length ? gastoNetoTotal / Math.max(1, periodsN) : a.sueldoQuincenal);
      const periodosNecesarios = ahorroEstPeriodo > 0 ? Math.ceil(restante / ahorroEstPeriodo) : null;
      const mesesEst = periodosNecesarios != null ? (periodo === 'mensual' ? periodosNecesarios : periodosNecesarios / 2) : null;

      return { banco, efectivo, totalAhorrado, meta, restante, pct, gastoNetoTotal, porCat, ahorroEstPeriodo, periodosNecesarios, mesesEst, periodo, periodRange, gastoPeriodoActual, disponiblePeriodo };
    }

    function computeCatBreakdown(periodoKeyFiltro) {
      const periodoActual = data.ajustes.periodo || 'quincenal';
      const porCat = {}; getCats().forEach(c => porCat[c] = 0);
      data.gastos.forEach(g => {
        if (periodoKeyFiltro) {
          if (!g.fecha) return;
          const k = periodKey(new Date(g.fecha + 'T00:00:00'), periodoActual);
          if (k !== periodoKeyFiltro) return;
        }
        const neto = g.monto - (g.reintegro || 0);
        porCat[g.cat] = (porCat[g.cat] || 0) + neto;
      });
      return porCat;
    }

    /* RESUMEN */
    let filtroCatResumen = { periodKey: '' };
    let periodosExpandidos = {};
    let historialMostrarTodos = false;
    function setFiltroCatResumen(val) { filtroCatResumen.periodKey = val; renderResumen(); }
    function togglePeriodoHistorial(key) { periodosExpandidos[key] = !periodosExpandidos[key]; renderResumen(); }
    function toggleOcultarSueldo() { data.ajustes.ocultarSueldo = !data.ajustes.ocultarSueldo; save(); renderResumen(); }
    function renderResumen() {
      const t = computeTotals();
      const pw = periodoLabelWord(t.periodo);
      const pwCap = pw === 'mensual' ? 'mes' : 'quincena';
      const historialPeriodos = buildPeriodHistory(t.periodo);

      const porCatFiltrado = computeCatBreakdown(filtroCatResumen.periodKey);
      const maxCat = Math.max(1, ...Object.values(porCatFiltrado));
      const catRows = getCats().filter(c => porCatFiltrado[c] > 0).sort((a, b) => porCatFiltrado[b] - porCatFiltrado[a]).map(c => `
    <div class="catbar-row" style="cursor:pointer;" onclick="filtroGastos.cat='${attrJs(c)}'; filtroGastos.periodKey='${filtroCatResumen.periodKey}'; filtroGastos.cuenta=''; renderGastos(); switchView('gastos');">
      <div class="lbl"><span class="lbl-icon">${icon(getCatIcon(c), 14)}</span><span class="lbl-text">${esc(c)}</span></div>
      <div class="catbar-track"><div class="catbar-fill" style="width:${(porCatFiltrado[c] / maxCat * 100).toFixed(0)}%"></div></div>
      <div class="catbar-amt">${money(porCatFiltrado[c])}</div>
    </div>`).join('') || `<div class="empty" style="padding:14px 0;">Sin gastos en este periodo.</div>`;

      document.getElementById('view-resumen').innerHTML = `
    <div class="hero">
      <svg class="hero-mascot" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="13.4" r="6.6"/><circle cx="6.7" cy="6.9" r="2.4"/><circle cx="17.3" cy="6.9" r="2.4"/><circle cx="9.1" cy="12.6" r="1" fill="#0003"/><circle cx="14.9" cy="12.6" r="1" fill="#0003"/><ellipse cx="12" cy="15.6" rx="1.7" ry="1.2" fill="#0003"/></svg>
      <div class="goal-label">Ahorrado hacia tu meta</div>
      <div class="goal-amt">${money(t.totalAhorrado)} <span class="of">de ${money(t.meta)}</span></div>
      <div class="stitch-wrap">
        <div class="stitch" style="--p:${t.pct.toFixed(1)}%"></div>
        <svg class="stitch-star" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2.7l2.5 5.4 5.8.8-4.3 4.1 1 5.8-5-2.9-5 2.9 1-5.8-4.3-4.1 5.8-.8z"/></svg>
      </div>
      <div class="foot-row"><span>${t.pct.toFixed(0)}% completado</span><span>Faltan ${money(t.restante)}</span></div>
    </div>

    <div class="eyebrow">Periodo actual</div>
    <div class="card">
      <div style="font-size:13.5px; font-weight:600; margin-bottom:12px;">${t.periodRange.label}</div>
      <div style="display:flex; justify-content:space-between; align-items:baseline;">
        <div>
          <div style="font-size:12px;color:var(--ink-soft);">Gastado en este ${pwCap}</div>
          <div style="font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; color:var(--bad);">${money(t.gastoPeriodoActual)}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:12px;color:var(--ink-soft);">Disponible del sueldo</div>
          <div style="font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; color:${t.disponiblePeriodo < 0 ? 'var(--bad)' : 'var(--good)'};">${money(t.disponiblePeriodo)}</div>
        </div>
      </div>
    </div>

    <div class="grid2">
      <div class="mini"><div class="k">${icon('banco', 13)} Banco</div><div class="v">${money(t.banco)}</div></div>
      <div class="mini"><div class="k">${icon('efectivo', 13)} Efectivo</div><div class="v">${money(t.efectivo)}</div></div>
      <div class="mini"><div class="k" style="display:flex; align-items:center; justify-content:space-between;"><span>Sueldo ${pw}</span><button type="button" onclick="toggleOcultarSueldo()" aria-label="Mostrar u ocultar sueldo" style="background:none; border:none; color:var(--ink-soft); padding:0; margin:-2px -2px 0 0; cursor:pointer; display:flex; flex-shrink:0;">${icon(data.ajustes.ocultarSueldo ? 'eyeOff' : 'eye', 14)}</button></div><div class="v">${data.ajustes.ocultarSueldo ? '••••••' : money(data.ajustes.sueldoQuincenal)}</div></div>
      <div class="mini"><div class="k">Ahorro prom. / ${pwCap}</div><div class="v ${t.ahorroEstPeriodo < 0 ? 'neg' : 'pos'}">${money(t.ahorroEstPeriodo)}</div></div>
    </div>

    <div class="eyebrow">Proyección (promedio histórico)</div>
    <div class="card">
      ${t.restante <= 0
          ? `<div style="display:flex; align-items:center; justify-content:center; gap:8px; padding:6px 0; font-family:'Baloo 2',sans-serif; font-size:16px; font-weight:700; color:var(--good);">${icon('check', 20)} ¡Meta alcanzada!</div>`
          : t.periodosNecesarios
            ? `<div style="display:flex; justify-content:space-between; align-items:baseline;">
               <div><div style="font-size:12px;color:var(--ink-soft);">${pw === 'mensual' ? 'Meses' : 'Quincenas'} necesarios</div><div style="font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600;">${t.periodosNecesarios}</div></div>
               <div style="text-align:right;"><div style="font-size:12px;color:var(--ink-soft);">Tiempo estimado</div><div style="font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600;">${t.mesesEst.toFixed(1)} meses</div></div>
             </div>`
            : `<div style="color:var(--ink-soft); font-size:13.5px;">Tu ritmo de gasto promedio supera tu sueldo — ajusta gastos para ver una proyección.</div>`
        }
    </div>

    <div class="eyebrow">Historial por periodo</div>
    <div class="card" style="padding:2px 16px;">
      ${(() => {
          const todos = historialPeriodos.filter(p => !p.enCurso);
          if (!todos.length) return `<div class="empty" style="padding:18px 0;">Cuando termine este ${pwCap}, aquí verás con cuánto cerraste.</div>`;
          const mostrar = historialMostrarTodos ? todos : todos.slice(0, 6);
          const filas = mostrar.map(p => {
            const abierto = !!periodosExpandidos[p.key];
            const catsTop = p.topCats.slice(0, 3).map(([c, v]) => `<span style="display:inline-block; margin-right:12px; margin-top:2px; font-size:11.5px; color:var(--ink-soft);">${esc(c)}: ${money(v)}</span>`).join('');
            return `
          <div class="hist-row">
            <button type="button" class="hist-toggle" onclick="togglePeriodoHistorial('${p.key}')">
              <span class="t1">${p.label}</span>
              <span style="display:flex; align-items:center; gap:8px;">
                <span class="ahorro" style="color:${p.ahorroNeto < 0 ? 'var(--bad)' : 'var(--good)'};">${money(p.ahorroNeto)}</span>
                <span class="hist-chevron ${abierto ? 'open' : ''}">${icon('chevron', 16)}</span>
              </span>
            </button>
            ${abierto ? `
            <div class="hist-detail">
              <div class="t2" style="margin-bottom:6px;">${p.gastosCount} gasto(s) registrados</div>
              <div style="display:flex; justify-content:space-between; gap:6px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; flex-wrap:wrap;">
                <span>Gastado <strong style="color:var(--bad);">${money(p.gastado)}</strong></span>
                <span>Ingresado <strong style="color:var(--good);">${money(p.ingresado)}</strong></span>
              </div>
              ${catsTop ? `<div style="margin-top:6px;">${catsTop}</div>` : ''}
              <div style="font-size:11px; color:var(--ink-soft); margin-top:6px;">Saldo total estimado al cierre: ${money(p.saldoCierre)}</div>
              <button type="button" onclick="filtroGastos.cat=''; filtroGastos.cuenta=''; filtroGastos.q=''; filtroGastos.periodKey='${p.key}'; renderGastos(); switchView('gastos');" style="background:none; border:none; color:var(--gold); font-size:12.5px; font-weight:600; cursor:pointer; padding:0; margin-top:10px;">Ver todos los gastos de este periodo →</button>
            </div>` : ''}
          </div>`;
          }).join('');
          const verMas = (!historialMostrarTodos && todos.length > 6)
            ? `<button type="button" onclick="historialMostrarTodos=true; renderResumen();" style="width:100%; background:none; border:none; color:var(--gold); font-size:12.5px; font-weight:600; cursor:pointer; padding:12px 2px; text-align:center;">Mostrar periodos anteriores (${todos.length - 6})</button>`
            : (historialMostrarTodos && todos.length > 6 ? `<button type="button" onclick="historialMostrarTodos=false; renderResumen();" style="width:100%; background:none; border:none; color:var(--gold); font-size:12.5px; font-weight:600; cursor:pointer; padding:12px 2px; text-align:center;">Mostrar menos</button>` : '');
          return filas + verMas;
        })()}
      <div style="font-size:11px; color:var(--ink-soft); padding:10px 2px 12px;">Toca un periodo para ver su detalle. "Ahorro del periodo" es lo que ingresaste menos lo que gastaste en esa quincena o mes (sin contar lo acumulado antes).</div>
    </div>

    <div class="eyebrow">Gasto neto por categoría</div>
    <div class="card">
      <div class="field" style="margin-bottom:12px;">
        <label>Periodo</label>
        <select onchange="setFiltroCatResumen(this.value)">
          <option value="">Todo el tiempo</option>
          ${historialPeriodos.map(p => `<option value="${p.key}" ${filtroCatResumen.periodKey === p.key ? 'selected' : ''}>${p.label}${p.enCurso ? ' (en curso)' : ''}</option>`).join('')}
        </select>
      </div>
      ${catRows}
      <div style="font-size:11px; color:var(--ink-soft); margin-top:10px;">Toca una categoría para ver todos sus gastos de ese periodo.</div>
    </div>
  `;
    }

    /* GASTOS */
    let filtroGastos = { cat: '', cuenta: '', periodKey: '', q: '' };
    function setFiltroGastos(field, val) { filtroGastos[field] = val; renderGastos(); }
    function limpiarFiltroGastos() { filtroGastos = { cat: '', cuenta: '', periodKey: '', q: '' }; renderGastos(); }
    function buscarGastos(val) {
      filtroGastos.q = val;
      const clearBtn = document.getElementById('gastosBuscarClear');
      if (clearBtn) clearBtn.style.display = val ? 'flex' : 'none';
      renderGastosList();
    }
    function limpiarBusquedaGastos() {
      filtroGastos.q = '';
      const input = document.getElementById('gastosBuscarInput');
      if (input) input.value = '';
      const clearBtn = document.getElementById('gastosBuscarClear');
      if (clearBtn) clearBtn.style.display = 'none';
      renderGastosList();
      if (input) input.focus();
    }
    function computeGastosFiltrados() {

    async function exportData() {
      const jsonStr = JSON.stringify(data, null, 2);
      const fileName = 'mis-finanzas-backup.json';
      const isNative = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();

      if (isNative) {
        // Método principal: diálogo nativo "Guardar como" de Android — tú eliges carpeta y nombre.
        const SaveFile = window.Capacitor.Plugins.SaveFile;
        if (SaveFile) {
          try {
            await SaveFile.saveFile({ fileName, data: jsonStr });
            showToast('Copia guardada donde elegiste');
            return;
          } catch (err) {
            const msg = String((err && err.message) || err || '').toLowerCase();
            if (msg.includes('cancel')) return;
          }
        }

        const Filesystem = window.Capacitor.Plugins.Filesystem;
        if (Filesystem) {
          const intentos = ['EXTERNAL', 'DOCUMENTS', 'DATA', 'CACHE'];
          let ultimoError = null;
          for (const dir of intentos) {
            try {
              await Filesystem.writeFile({ path: fileName, data: jsonStr, directory: dir, encoding: 'utf8', recursive: true });
              lastExportFileName = fileName;
              lastExportDirectory = dir;
              lastExportJsonStr = jsonStr;
              const dirNota = {
                DOCUMENTS: 'Puedes verlo con un explorador de archivos, en Android/data/com.andre.misfinanzas/files/Documents.',
                EXTERNAL: 'Puedes verlo con un explorador de archivos, dentro de la carpeta de esta app.',
                DATA: 'Este espacio es privado de la app — no aparece en un explorador de archivos. Usa el botón de abajo para sacarlo.',
                CACHE: 'Este espacio es temporal y privado de la app. Usa el botón de abajo para sacarlo antes de que se borre.'
              }[dir] || '';
              openSheet('Copia guardada', `
            <p style="color:var(--ink-soft); font-size:14px; line-height:1.5; margin-top:-8px;">
              Se guardó como <strong>${fileName}</strong>. ${dirNota}

            <button class="btn" onclick="shareLastExport()">
              <span style="display:inline-flex;align-items:center;gap:8px;justify-content:center;width:100%;">${icon('upload', 16)} Compartir o guardar en otro lugar</span>
            </button>
            <button class="btn ghost" style="margin-top:8px;" onclick="closeSheet()">Listo</button>
          `);
              return;
            } catch (err) {
              ultimoError = (err && (err.message || String(err))) || 'error desconocido';
              continue;
            }
          }
          await exportFallbackClipboard(jsonStr, ultimoError);
          return;
        }
        await exportFallbackClipboard(jsonStr, 'Ningún método de guardado está disponible en esta compilación');
        return;
      }

      // Navegador
      try {
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const el = document.createElement('a');
        el.href = url; el.download = fileName;
        document.body.appendChild(el); el.click(); document.body.removeChild(el);
        setTimeout(() => URL.revokeObjectURL(url), 4000);
        showToast('Copia exportada a Descargas');
      } catch (err) {
        await exportFallbackClipboard(jsonStr, (err && err.message) || String(err));
      }
    }

          return;
        }
        await new Promise(r => setTimeout(r, 400));

          await Share.share({
            title: 'Copia de seguridad — Mis Finanzas',
            text: lastExportJsonStr || '',

          });
          shareInProgress = false;
          return;
        } catch (err2) {
          shareInProgress = false;
          if (String(err2 && err2.message || err2).toLowerCase().includes('progress')) {
            mostrarAtascado();
            return;
          }
          const motivo = (err2 && (err2.message || String(err2))) || 'error desconocido';
          openSheet('No se pudo compartir', `
        <p style="color:var(--ink-soft); font-size:14px; line-height:1.5; margin-top:-8px;">
          Tu copia sigue guardada en el teléfono, pero no se pudo abrir el menú de compartir.

        <button class="btn ghost" style="margin-top:10px;" onclick="closeSheet()">Cerrar</button>

      `);
        }
      }
    }

        cuentaReintegro: reintegro > 0 ? segVal('gReintegroCuentaSeg') : ""
      };
      if (editingGastoId) {
        const idx = data.gastos.findIndex(x => x.id === editingGastoId);
        if (idx > -1) data.gastos[idx] = { ...data.gastos[idx], ...payload };
        editingGastoId = null;
        save(); closeSheet(); renderAll(); showToast('Gasto actualizado');
      } else {
        data.gastos.push({ id: uid(), ...payload, hist: false });
        save(); closeSheet(); renderAll(); showToast('Gasto agregado');
      }
    }

    let editingIngresoId = null;
    function openAddIngreso(isSueldo) {
      editingIngresoId = null;
      openIngresoSheet(null, !!isSueldo);
    }
    function openEditIngreso(id) {
      const i = data.ingresos.find(x => x.id === id);
      if (!i) return;
      editingIngresoId = id;
      openIngresoSheet(i, i.tipo === 'sueldo');
    }
    function openIngresoSheet(existing, isSueldo) {
      const descDefault = existing ? existing.desc : (isSueldo ? ('Sueldo ' + periodoLabelWord(data.ajustes.periodo)) : '');
      const montoDefault = existing ? existing.monto : (isSueldo ? data.ajustes.sueldoQuincenal : '');
      const bancoOn = !existing || existing.cuenta === 'Banco';
      openSheet(existing ? 'Editar ingreso' : (isSueldo ? 'Depósito de sueldo' : 'Nuevo ingreso extra'), `
    <input type="hidden" id="iTipo" value="${isSueldo ? 'sueldo' : ''}">
    <div class="field"><label>Descripción</label><input type="text" id="iDesc" placeholder="Ej. Regalo, bono, venta..." value="${esc(descDefault)}"></div>
    <div class="row2">
      <div class="field"><label>Monto</label><input type="number" step="0.01" id="iMonto" placeholder="0.00" inputmode="decimal" value="${montoDefault}"></div>
      <div class="field"><label>Fecha</label><input type="date" id="iFecha" value="${existing ? existing.fecha : todayStr()}"></div>
    </div>
    <div class="field"><label>¿A qué cuenta entra?</label>
      <div class="seg" id="iCuentaSeg">
        <button type="button" class="${bancoOn ? 'on' : ''}" data-v="Banco">${icon('banco', 14)} Banco</button>
        <button type="button" class="${bancoOn ? '' : 'on'}" data-v="Efectivo">${icon('efectivo', 14)} Efectivo</button>
      </div>
    </div>
    <button class="btn" onclick="saveIngreso()">${existing ? 'Guardar cambios' : 'Guardar ingreso'}</button>
    ${existing ? `<button class="btn danger" style="margin-top:8px;" onclick="delIngreso('${existing.id}'); closeSheet();">Eliminar ingreso</button>` : ''}
    <button class="btn ghost" style="margin-top:8px;" onclick="closeSheet()">Cancelar</button>
  `);
      wireSeg('iCuentaSeg');
    }
    function saveIngreso() {
      const monto = parseFloat(document.getElementById('iMonto').value);
      if (!monto || monto <= 0) { showToast('Ingresa un monto válido'); return; }
      const payload = {
        fecha: document.getElementById('iFecha').value || todayStr(),
        desc: document.getElementById('iDesc').value.trim(),
        monto,
        cuenta: segVal('iCuentaSeg'),
        tipo: document.getElementById('iTipo').value || ''
      };
      if (editingIngresoId) {
        const idx = data.ingresos.findIndex(x => x.id === editingIngresoId);
        if (idx > -1) data.ingresos[idx] = { ...data.ingresos[idx], ...payload };
        editingIngresoId = null;
        save(); closeSheet(); renderAll(); showToast('Ingreso actualizado');
      } else {
        data.ingresos.push({ id: uid(), ...payload });
        save(); closeSheet(); renderAll(); showToast(payload.tipo === 'sueldo' ? 'Depósito de sueldo registrado' : 'Ingreso agregado');
      }
    }

    let currentView = 'resumen';
    const titles = { resumen: 'Resumen', gastos: 'Gastos', ingresos: 'Ingresos extra', ajustes: 'Ajustes' };
    function switchView(v) {
      currentView = v;
      document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
      document.getElementById('view-' + v).classList.add('active');
      document.querySelectorAll('nav.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
      document.getElementById('pageTitle').textContent = titles[v];
      document.getElementById('fabAdd').style.display = (v === 'ajustes') ? 'none' : 'flex';
      window.scrollTo(0, 0);
    }
    document.querySelectorAll('nav.tabbar button').forEach(b => {
      b.addEventListener('click', () => switchView(b.dataset.view));
    });
    document.getElementById('fabAdd').addEventListener('click', openAddSheet);

    let toastTimer;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
    }

    function esc(s) { return (s || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }

    /* TUTORIAL */
    const TUTORIAL_SLIDES = [
      { icono: 'oso', titulo: '¡Bienvenido a tu app de finanzas!', texto: 'Lleva el control de tus gastos e ingresos, quincena a quincena. Toda tu información se guarda solo en este teléfono o en el navegador.' },
      { icono: 'estrellita', titulo: 'Resumen', texto: 'Aquí ves cuánto llevas ahorrado hacia tu meta, lo gastado en el periodo actual, tu historial por quincena (toca uno para ver el detalle) y cuánto gastas por categoría.' },
      { icono: 'canasta', titulo: 'Gastos', texto: 'Toca el botón + para registrar un gasto. Puedes filtrarlos por categoría, cuenta o periodo, y buscarlos por descripción. Toca cualquiera para editarlo.' },
      { icono: 'saco', titulo: 'Ingresos', texto: 'Registra tu depósito de sueldo con un toque, o cualquier ingreso extra como regalos o bonos.' },
      { icono: 'flor', titulo: 'Ajustes', texto: 'Configura tu sueldo y meta de ahorro, crea y personaliza tus categorías con su propio ícono, cambia los colores de la app, y exporta una copia de seguridad de tus datos.' }
    ];
    let tutorialPaso = 0;
    function iniciarTutorial() {
      tutorialPaso = 0;
      renderTutorial();
      document.getElementById('tutorialOverlay').classList.add('show');
      bloquearScroll();
    }
    function renderTutorial() {
      const s = TUTORIAL_SLIDES[tutorialPaso];
      const esUltimo = tutorialPaso === TUTORIAL_SLIDES.length - 1;
      document.getElementById('tutorialCard').innerHTML = `
    <div class="tutorial-icon">${icon(s.icono, 42)}</div>
    <div class="tutorial-title">${esc(s.titulo)}</div>
    <div class="tutorial-text">${esc(s.texto)}</div>
    <div class="tutorial-dots">${TUTORIAL_SLIDES.map((_, i) => `<span class="${i === tutorialPaso ? 'on' : ''}"></span>`).join('')}</div>
    <button class="btn" onclick="siguienteTutorial()">${esUltimo ? 'Empezar' : 'Siguiente'}</button>
    <div class="tutorial-nav">
      <button type="button" class="tutorial-link ${tutorialPaso === 0 ? 'hidden' : ''}" onclick="anteriorTutorial()">Atrás</button>
      <button type="button" class="tutorial-link ${esUltimo ? 'hidden' : ''}" onclick="cerrarTutorial()">Saltar</button>
    </div>
  `;
    }
    function siguienteTutorial() {
      if (tutorialPaso < TUTORIAL_SLIDES.length - 1) { tutorialPaso++; renderTutorial(); }
      else cerrarTutorial();
    }
    function anteriorTutorial() {
      if (tutorialPaso > 0) { tutorialPaso--; renderTutorial(); }
    }
    function cerrarTutorial() {
      document.getElementById('tutorialOverlay').classList.remove('show');
      desbloquearScroll();
      localStorage.setItem('bitacora_tutorial_visto', '1');
    }

    function renderAll() {
      renderResumen(); renderGastos(); renderIngresos(); renderAjustes();
    }
    renderAll();
    switchView('resumen');
    if (!localStorage.getItem('bitacora_tutorial_visto')) {
      iniciarTutorial();
    }
  </script>
</body>

</html>
