  <script>
    (function () {
      try {
        var theme = localStorage.getItem('bitacora_theme');
        if (!theme) { theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; }
        var ap = { paletteKey: 'papel', accent: '#FF8FAE' };
        var apRaw = localStorage.getItem('bitacora_apariencia');
        if (apRaw) { try { var parsed = JSON.parse(apRaw); if (parsed && typeof parsed === 'object') ap = parsed; } catch (e) { } }
        var PAL = {
          papel: { light: { paper: '#FFF6F8', paper2: '#FFE8ED', ink: '#5B4B63', card: '#FFFFFF' }, dark: { paper: '#241B2E', paper2: '#2E2339', ink: '#F5E9F0', card: '#2E2339' } },
          pizarra: { light: { paper: '#F6F1FC', paper2: '#ECE1F8', ink: '#52456B', card: '#FFFFFF' }, dark: { paper: '#241E30', paper2: '#2C2440', ink: '#F0E9FA', card: '#2C2440' } },
          menta: { light: { paper: '#F0FBF6', paper2: '#DFF5EA', ink: '#2E5C48', card: '#FFFFFF' }, dark: { paper: '#16261F', paper2: '#1D3327', ink: '#E3F5EC', card: '#1D3327' } },
          arena: { light: { paper: '#FFF3EA', paper2: '#FFE3CC', ink: '#6B4A2E', card: '#FFFFFF' }, dark: { paper: '#2E2013', paper2: '#3A2A19', ink: '#FBE7D2', card: '#3A2A19' } }
        };
        var pal = (PAL[ap.paletteKey] || PAL.papel)[theme];
        function hexToRgb(hex) {
          hex = hex.replace('#', '');
          if (hex.length === 3) hex = hex.split('').map(function (c) { return c + c; }).join('');
          var num = parseInt(hex, 16);
          return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
        }
        function rgbaStr(hex, a) { var c = hexToRgb(hex); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
        function mixHex(h1, h2, w) {
          var c1 = hexToRgb(h1), c2 = hexToRgb(h2);
          var r = Math.round(c1[0] * (1 - w) + c2[0] * w), g = Math.round(c1[1] * (1 - w) + c2[1] * w), b = Math.round(c1[2] * (1 - w) + c2[2] * w);
          return 'rgb(' + r + ',' + g + ',' + b + ')';
        }
        var baseAccent = ap.accent || '#FF8FAE';
        var accent = theme === 'dark' ? mixHex(baseAccent, '#ffffff', 0.22) : baseAccent;
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        var s = root.style;
        s.setProperty('--paper', pal.paper);
        s.setProperty('--paper-2', pal.paper2);
        s.setProperty('--ink', pal.ink);
        s.setProperty('--card', pal.card);
        s.setProperty('--ink-soft', rgbaStr(pal.ink, 0.62));
        s.setProperty('--line', rgbaStr(pal.ink, 0.14));
        s.setProperty('--line-strong', rgbaStr(pal.ink, 0.28));
        s.setProperty('--gold', accent);
        s.setProperty('--gold-dark', mixHex(accent, '#000000', theme === 'dark' ? 0.30 : 0.22));
        s.setProperty('--gold-soft', mixHex(accent, theme === 'dark' ? '#000000' : '#ffffff', 0.35));
        s.setProperty('--gold-bg', rgbaStr(accent, 0.13));
        s.background = pal.paper;
      } catch (e) { }
    })();
  </script>

  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23FF8FAE'/%3E%3Ccircle cx='50' cy='46' r='22' fill='%235B4B63'/%3E%3Ccircle cx='30' cy='26' r='9' fill='%235B4B63'/%3E%3Ccircle cx='70' cy='26' r='9' fill='%235B4B63'/%3E%3C/svg%3E">
  <style>
    :root {
      --paper: #FFF6F8;
      --paper-2: #FFE8ED;
      --ink: #5B4B63;
      --ink-soft: #8D7C93;
      --line: rgba(91, 75, 99, 0.10);
      --line-strong: rgba(91, 75, 99, 0.20);
      --gold: #FF8FAE;
      --gold-dark: #D9648A;
      --gold-soft: #FFC7D6;
      --gold-bg: rgba(255, 143, 174, 0.16);
      --good: #2FB682;
      --bad: #FF6B85;
      --card: #FFFFFF;
      --shadow-soft: 0 10px 22px -12px rgba(91, 75, 99, .24), 0 2px 6px -2px rgba(91, 75, 99, .12);
      --shadow-press: 0 2px 6px -2px rgba(91, 75, 99, .20);
      --radius: 24px;
    }

    [data-theme="dark"] {
      --paper: #241B2E;
      --paper-2: #2E2339;
      --ink: #F5E9F0;
      --ink-soft: #C8B4C8;
      --line: rgba(245, 233, 240, 0.10);
      --line-strong: rgba(245, 233, 240, 0.20);
      --gold: #FFA8C1;
      --gold-dark: #C46F8C;
      --gold-soft: #5C3E4C;
      --gold-bg: rgba(255, 168, 193, 0.18);
      --good: #5FD9A4;
      --bad: #FF93A8;
      --card: #2E2339;
      --shadow-soft: 0 12px 24px -10px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .35);
      --shadow-press: 0 2px 6px -2px rgba(0, 0, 0, .45);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overscroll-behavior: none;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Nunito', sans-serif;
      transition: background .25s ease, color .25s ease;
      overscroll-behavior: none;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 12% 6%, var(--gold-bg) 0, transparent 42%),
        radial-gradient(circle at 88% 2%, var(--gold-bg) 0, transparent 36%),
        var(--paper);
      position: relative;
      overscroll-behavior: none;
    }

    .app::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: .5;
      background-image:
        radial-gradient(var(--line-strong) 1px, transparent 1.4px),
        radial-gradient(var(--line-strong) 1px, transparent 1.4px);
      background-size: 64px 64px, 96px 96px;
      background-position: 8px 18px, 46px 70px;
      mask-image: linear-gradient(to bottom, black, black 220px, transparent 520px);
    }

    header.topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: max(18px, env(safe-area-inset-top)) 20px 14px;
      background: linear-gradient(var(--paper) 65%, transparent);
      backdrop-filter: blur(6px);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .brand .mark {
      font-family: 'Baloo 2', sans-serif;
      font-weight: 700;
      font-size: 16px;
      background: var(--gold);
      color: #fff;
      box-shadow: 0 4px 8px -3px rgba(91, 75, 99, .4);
      border-radius: 999px;
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transform: translateY(2px);
    }

      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 25;
      max-width: 480px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 26px 26px 0 0;
      display: flex;
      padding: 10px 6px max(10px, env(safe-area-inset-bottom));
      box-shadow: 0 -10px 26px -12px rgba(91, 75, 99, .35);
    }

    nav.tabbar button {
      flex: 1;
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      color: var(--ink-soft);
      padding: 7px 2px;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      transition: transform .12s ease;
    }

    nav.tabbar button:active {
      transform: scale(.9);
    }

    nav.tabbar button svg {
      width: 21px;
      height: 21px;
    }

    nav.tabbar button span {
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: .01em;
    }

    nav.tabbar button.on {
      color: var(--gold);
    }

    nav.tabbar button.on svg {
      animation: bounceIn .4s cubic-bezier(.34, 1.56, .64, 1);
    }

    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(20px) scale(.9);
      background: var(--ink);
      color: var(--paper);
      padding: 12px 20px;
      border-radius: 999px;
      font-size: 13.5px;
      z-index: 60;
      opacity: 0;
      transition: all .3s cubic-bezier(.34, 1.56, .64, 1);
      pointer-events: none;
      font-weight: 800;
      box-shadow: 0 8px 20px -6px rgba(0, 0, 0, .35);
    }

    [data-theme="dark"] .toast {
      background: var(--gold);
      color: var(--paper-2);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    .tutorial-overlay {
      position: fixed;
      inset: 0;
      z-index: 70;
      background: var(--paper);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .tutorial-overlay.show {
      display: flex;
    }

    .tutorial-card {
      width: 100%;
      max-width: 360px;
      text-align: center;
      animation: popIn .35s cubic-bezier(.32, 1, .4, 1);
    }

    .tutorial-icon {
      width: 92px;
      height: 92px;
      border-radius: 999px;
      background: var(--gold);
      color: #fff;
      box-shadow: var(--shadow-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 26px;
    }

    .tutorial-title {
      font-family: 'Baloo 2', sans-serif;
      font-size: 23px;
      font-weight: 700;
      margin: 0 0 12px;
    }

    .tutorial-text {
      font-size: 14.5px;
      color: var(--ink-soft);
      line-height: 1.65;
      font-weight: 600;
    }

    .tutorial-dots {
      display: flex;
      gap: 7px;
      justify-content: center;
      margin: 30px 0 26px;
    }

    .tutorial-dots span {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--line-strong);
      transition: all .25s cubic-bezier(.34, 1.56, .64, 1);
    }

    .tutorial-dots span.on {
      background: var(--gold);
      width: 24px;
    }

    .tutorial-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }

    .tutorial-link {
      background: none;
      border: none;
      color: var(--ink-soft);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      padding: 10px 4px;
    }

    .tutorial-link.hidden {
      visibility: hidden;
    }

    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>

        if (!map[k]) map[k] = { start: d, ingresos: 0, cambioNeto: 0, gastado: 0, porCat: {}, gastosCount: 0 };

      }
      data.gastos.forEach(g => {
        if (!g.fecha) return;
        const d = new Date(g.fecha + 'T00:00:00');
        const k = periodKey(d, periodo);
        ensure(k, d);
        if (!g.hist) {
          map[k].cambioNeto -= g.monto;
          const neto = g.monto - (g.reintegro || 0);
          map[k].gastado += neto;
          map[k].porCat[g.cat] = (map[k].porCat[g.cat] || 0) + neto;
          map[k].gastosCount++;
        }
        if (g.reintegro > 0) { map[k].cambioNeto += g.reintegro; }
      });
      data.ingresos.forEach(i => {
        if (!i.fecha) return;
        const d = new Date(i.fecha + 'T00:00:00');
        const k = periodKey(d, periodo);
        ensure(k, d);
        map[k].ingresos += i.monto;
        map[k].cambioNeto += i.monto;
      });
      const currentKey = periodKey(new Date(), periodo);
      const keys = Object.keys(map).sort((a, b) => map[a].start - map[b].start);
      let running = (data.cuentasBanco || []).reduce((s, c) => s + (c.saldoInicial || 0), 0) + data.ajustes.saldoInicialEfectivo;
      const periods = [];
      keys.forEach(k => {
        running += map[k].cambioNeto;
        const range = getPeriodRange(map[k].start, periodo);
        const topCats = Object.entries(map[k].porCat).filter(([, v]) => v !== 0).sort((a, b) => b[1] - a[1]);
        periods.push({
          key: k, label: range.label, enCurso: k === currentKey,
          gastado: map[k].gastado, ingresado: map[k].ingresos, saldoCierre: running,
          ahorroNeto: map[k].ingresos - map[k].gastado,
          gastosCount: map[k].gastosCount,
          topCats
        });
      });
      return periods.reverse();
    }

    function computeCuentasBalances() {
      const balances = {};
      function add(nombre, monto) { if (!nombre) return; balances[nombre] = (balances[nombre] || 0) + monto; }
      add('Efectivo', data.ajustes.saldoInicialEfectivo || 0);
      (data.cuentasBanco || []).forEach(c => add(c.nombre, c.saldoInicial || 0));
      data.gastos.forEach(g => {
        if (!g.hist) add(g.cuenta, -g.monto);
        if (g.reintegro > 0 && g.cuentaReintegro) add(g.cuentaReintegro, g.reintegro);
      });
      data.ingresos.forEach(i => add(i.cuenta, i.monto));
      (data.transferencias || []).forEach(tr => {
        add(tr.origen, -tr.monto);
        add(tr.destino, tr.monto);
      });
      return balances;
    }
    function computeTotals() {
      const a = data.ajustes;
      const periodo = a.periodo || 'quincenal';
      const balances = computeCuentasBalances();
      const efectivo = balances['Efectivo'] || 0;
      const nombresBanco = new Set([...(data.cuentasBanco || []).map(c => c.nombre), ...Object.keys(balances).filter(k => k !== 'Efectivo')]);
      let banco = 0; nombresBanco.forEach(n => banco += (balances[n] || 0));
      const totalAhorrado = banco + efectivo;
      const meta = a.metaAhorro;
      const restante = Math.max(0, meta - totalAhorrado);
      const pct = meta > 0 ? Math.min(100, (totalAhorrado / meta) * 100) : 0;

      let gastoNetoTotal = 0;
      const porCat = {}; getCats().forEach(c => porCat[c] = 0);
      data.gastos.forEach(g => {
        const neto = g.monto - (g.reintegro || 0);
        gastoNetoTotal += neto;
        porCat[g.cat] = (porCat[g.cat] || 0) + neto;
      });

      const periodRange = getPeriodRange(new Date(), periodo);
      let gastoPeriodoActual = 0;
      data.gastos.forEach(g => {
        if (inRange(g.fecha, periodRange.start, periodRange.end)) {
          gastoPeriodoActual += (g.monto - (g.reintegro || 0));
        }
      });

      let aportesAhorroPeriodo = 0;
      (data.transferencias || []).forEach(tr => {
        if (!inRange(tr.fecha, periodRange.start, periodRange.end)) return;
        const origenGasta = esCuentaParaGastar(tr.origen);
        const destinoGasta = esCuentaParaGastar(tr.destino);
        if (origenGasta && !destinoGasta) aportesAhorroPeriodo += tr.monto;
        else if (!origenGasta && destinoGasta) aportesAhorroPeriodo -= tr.monto;
      });
      const disponiblePeriodo = a.sueldoQuincenal - gastoPeriodoActual - aportesAhorroPeriodo;

      let disponibleTotal = 0;
      Object.keys(balances).forEach(nombre => { if (esCuentaParaGastar(nombre)) disponibleTotal += balances[nombre]; });

      const periodsN = periodsCount(periodo);
      const ahorroEstPeriodo = a.sueldoQuincenal - (data.gastos.length ? gastoNetoTotal / Math.max(1, periodsN) : a.sueldoQuincenal);
      const periodosNecesarios = ahorroEstPeriodo > 0 ? Math.ceil(restante / ahorroEstPeriodo) : null;
      const mesesEst = periodosNecesarios != null ? (periodo === 'mensual' ? periodosNecesarios : periodosNecesarios / 2) : null;

      return { banco, efectivo, balances, totalAhorrado, meta, restante, pct, gastoNetoTotal, porCat, ahorroEstPeriodo, periodosNecesarios, mesesEst, periodo, periodRange, gastoPeriodoActual, aportesAhorroPeriodo, disponiblePeriodo, disponibleTotal };
    }

    function computeCatBreakdown(periodoKeyFiltro) {
      const periodoActual = data.ajustes.periodo || 'quincenal';
      const porCat = {}; getCats().forEach(c => porCat[c] = 0);
      data.gastos.forEach(g => {
        if (periodoKeyFiltro) {
          if (!g.fecha) return;
          const k = periodKey(new Date(g.fecha + 'T00:00:00'), periodoActual);
          if (k !== periodoKeyFiltro) return;
        }
        const neto = g.monto - (g.reintegro || 0);
        porCat[g.cat] = (porCat[g.cat] || 0) + neto;
      });
      return porCat;

    <div class="eyebrow">Ingresos extra${hayFiltro ? ' (filtrado)' : ''}</div>
    ${hayFiltro ? `<div style="font-size:12.5px; color:var(--ink-soft); margin:-2px 0 10px;">${items.length} ingreso(s) · Total ${money(totalFiltrado)}</div>` : `<div style="font-size:12px; color:var(--ink-soft); margin:-2px 0 10px;">Toca un ingreso para editarlo.</div>`}

    function renderAjustes() {

        })()}
      <button type="button" class="btn ghost" style="margin-top:12px;" onclick="openCuentaBancoSheet(null)">
        <span style="display:inline-flex;align-items:center;gap:8px;justify-content:center;width:100%;">${icon('plus', 16)} Nueva cuenta bancaria</span>
      </button>
    </div>

    <div class="eyebrow">Categorías</div>
    <div class="card">
      <div style="font-size:12.5px; color:var(--ink-soft); margin-bottom:10px; line-height:1.5;">Toca una categoría para editar su nombre o ícono. Usa las flechas para reordenarlas. Debe quedar al menos una.</div>
      ${(data.categorias || []).map((c, i, arr) => `
        <div class="list-item" style="padding:9px 2px; gap:6px;">
          <div class="li-mid" style="display:flex; align-items:center; gap:10px; flex:1; min-width:0; cursor:pointer;" onclick="openCategoriaSheet('${attrJs(c)}')">

            <div class="t1">${esc(c)}</div>

          <button class="li-order-btn" ${i === 0 ? 'disabled' : ''} onclick="moverCategoria('${attrJs(c)}',-1)" aria-label="Subir">${icon('arrowUp', 15)}</button>
          <button class="li-order-btn" ${i === arr.length - 1 ? 'disabled' : ''} onclick="moverCategoria('${attrJs(c)}',1)" aria-label="Bajar">${icon('arrowDown', 15)}</button>
          <button class="li-del" onclick="delCategoria('${attrJs(c)}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>
        </div>`).join('')}
      <button type="button" class="btn ghost" style="margin-top:12px;" onclick="openCategoriaSheet(null)">
        <span style="display:inline-flex;align-items:center;gap:8px;justify-content:center;width:100%;">${icon('plus', 16)} Nueva categoría</span>
      </button>
    </div>

    <div class="eyebrow">Apariencia</div>
    <div class="card">
      <div class="field"><label>Paleta de colores</label></div>
      ${PALETTES.map(p => `
        <div class="palette-card ${appearance.paletteKey === p.key ? 'on' : ''}" onclick="selectPalette('${p.key}')">
          <div class="palette-dots">
            <span style="background:${p.light.paper}"></span>
            <span style="background:${p.light.paper2}"></span>
            <span style="background:${p.dark.paper}"></span>
          </div>
          <div class="pname">${p.name}</div>
        </div>
      `).join('')}
      <div class="field" style="margin-top:14px; margin-bottom:0;"><label>Color de acento</label>
        <div class="swatch-row" id="accentSwatchRow">
          ${ACCENTS.map(ac => `<button type="button" class="swatch ${(appearance.accent || '').toLowerCase() === ac.hex.toLowerCase() ? 'on' : ''}" data-hex="${ac.hex}" style="background:${ac.hex}" onclick="selectAccent('${ac.hex}')" aria-label="${ac.key}"></button>`).join('')}
          <button type="button" class="swatch swatch-custom ${ACCENTS.some(a => a.hex.toLowerCase() === (appearance.accent || '').toLowerCase()) ? '' : 'on'}" id="customColorSwatchBtn" onclick="toggleColorPickerCustom()" aria-label="Color personalizado">${icon('palette', 18)}</button>
        </div>
        <div id="customColorPickerWrap" style="display:${mostrarPickerCustom ? 'block' : 'none'}; margin-top:14px;">
          <div class="sv-square" id="svSquare"><div class="sv-cursor" id="svCursor"></div></div>
          <div class="hue-slider" id="hueSlider"><div class="hue-cursor" id="hueCursor"></div></div>
          <div style="display:flex; align-items:center; gap:10px; margin-top:14px;">
            <div id="accentPreviewBox" style="width:38px;height:38px;border-radius:11px;background:${appearance.accent};border:1px solid var(--line-strong); flex-shrink:0;"></div>
            <input type="text" id="customColorHexInput" value="${appearance.accent.toUpperCase()}" maxlength="7" placeholder="#RRGGBB" oninput="onCustomAccentHex(this.value)" style="flex:1; font-family:'IBM Plex Mono',monospace; letter-spacing:.04em; text-transform:uppercase;">
          </div>
        </div>
      </div>
    </div>

    <div class="eyebrow">Ayuda</div>
    <div class="card">
      <button type="button" class="btn ghost" onclick="iniciarTutorial()">
        <span style="display:inline-flex;align-items:center;gap:8px;justify-content:center;width:100%;">${icon('ayuda', 16)} Ver el tutorial de nuevo</span>
      </button>
    </div>

    <div class="eyebrow">Datos</div>
    <div class="card">
      <div style="font-size:13px; color:var(--ink-soft); margin-bottom:12px; line-height:1.5;">
        Tu información se guarda solo en este teléfono o navegador.
      </div>
      <button class="btn ghost" onclick="exportData()"><span style="display:inline-flex;align-items:center;gap:8px;justify-content:center;width:100%;">${icon('download', 16)} Exportar copia de seguridad (.json)</span></button>
      <div style="height:10px;"></div>
      <button class="btn ghost" onclick="triggerImport()"><span style="display:inline-flex;align-items:center;gap:8px;justify-content:center;width:100%;">${icon('upload', 16)} Importar copia de seguridad (.json)</span></button>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="handleImportFile(event)">
      <div style="text-align:center; margin-top:8px;"><button type="button" onclick="openImportPaste()" style="background:none; border:none; color:var(--ink-soft); font-size:12px; text-decoration:underline; cursor:pointer;">¿No funciona? Importar pegando el texto</button></div>
      <div style="height:10px;"></div>
      <button class="btn danger" onclick="confirmReset()">Vaciar todos los datos</button>
      <div style="font-size:11.5px; color:var(--ink-soft); margin-top:8px; line-height:1.4;">Deja la app en blanco, sin gastos ni ajustes.</div>
    </div>
  `;
      wireSeg('cfgPeriodoSeg');
      document.getElementById('cfgPeriodoSeg').querySelectorAll('button').forEach(b => {
        b.addEventListener('click', () => {
          document.getElementById('cfgSueldoLabel').textContent = 'Sueldo ' + periodoLabelWord(b.dataset.v);

      if (mostrarPickerCustom) wireColorPicker();

    function saveAjustes() {
      data.ajustes.sueldoQuincenal = parseFloat(document.getElementById('cfgSueldo').value) || 0;
      data.ajustes.metaAhorro = parseFloat(document.getElementById('cfgMeta').value) || 0;
      data.ajustes.saldoInicialEfectivo = parseFloat(document.getElementById('cfgEfectivo').value) || 0;
      data.ajustes.periodo = segVal('cfgPeriodoSeg');
      save(); renderAll(); showToast('Ajustes guardados');
    }

    function openCuentaBancoSheet(nombreExistente) {
      const cuenta = nombreExistente ? (data.cuentasBanco || []).find(c => c.nombre === nombreExistente) : null;
      const paraGastar = cuenta ? cuenta.paraGastar !== false : true;
      openSheet(nombreExistente ? 'Editar cuenta bancaria' : 'Nueva cuenta bancaria', `
    <div class="field"><label>Nombre</label><input type="text" id="cbNombreInput" placeholder="Ej. Banco Agrícola, BAC..." value="${cuenta ? esc(cuenta.nombre) : ''}"></div>
    <div class="field"><label>Saldo actual</label><input type="number" step="0.01" id="cbSaldoInput" placeholder="0.00" value="${cuenta ? cuenta.saldoInicial : ''}"></div>
    <div class="field" style="display:flex; align-items:flex-start; gap:10px;">
      <input type="checkbox" id="cbParaGastar" ${paraGastar ? 'checked' : ''} style="width:18px;height:18px; margin-top:2px; flex-shrink:0; accent-color:var(--gold);">
      <label for="cbParaGastar" style="margin:0; font-size:13px; color:var(--ink); line-height:1.4;">Cuenta para gastar — su saldo cuenta en tu "Disponible total". Desmárcala si es una cuenta que solo usas para ahorrar.</label>
    </div>
    <button class="btn" onclick="guardarCuentaBanco(${nombreExistente ? `'${attrJs(nombreExistente)}'` : 'null'})">${nombreExistente ? 'Guardar cambios' : 'Crear cuenta'}</button>
    <button class="btn ghost" style="margin-top:8px;" onclick="closeSheet()">Cancelar</button>
  `);
    }
    function guardarCuentaBanco(nombreExistente) {
      const nombre = (document.getElementById('cbNombreInput').value || '').trim();
      const saldoInicial = parseFloat(document.getElementById('cbSaldoInput').value) || 0;
      const paraGastar = document.getElementById('cbParaGastar').checked;
      if (!nombre) { showToast('Escribe un nombre para la cuenta'); return; }
      if (nombre.toLowerCase() === 'efectivo') { showToast('Ese nombre está reservado para tu Efectivo'); return; }
      const yaExiste = (data.cuentasBanco || []).some(c => c.nombre.toLowerCase() === nombre.toLowerCase() && c.nombre !== nombreExistente);
      if (yaExiste) { showToast('Ya existe otra cuenta con ese nombre'); return; }

      if (nombreExistente) {
        const idx = data.cuentasBanco.findIndex(c => c.nombre === nombreExistente);
        if (idx > -1) { data.cuentasBanco[idx].nombre = nombre; data.cuentasBanco[idx].saldoInicial = saldoInicial; data.cuentasBanco[idx].paraGastar = paraGastar; }
        if (nombre !== nombreExistente) {
          data.gastos.forEach(g => {
            if (g.cuenta === nombreExistente) g.cuenta = nombre;
            if (g.cuentaReintegro === nombreExistente) g.cuentaReintegro = nombre;
          });
          data.ingresos.forEach(i => { if (i.cuenta === nombreExistente) i.cuenta = nombre; });
          (data.transferencias || []).forEach(tr => {
            if (tr.origen === nombreExistente) tr.origen = nombre;
            if (tr.destino === nombreExistente) tr.destino = nombre;
          });
          if (filtroGastos.cuenta === nombreExistente) filtroGastos.cuenta = nombre;
          if (filtroIngresos.cuenta === nombreExistente) filtroIngresos.cuenta = nombre;
        }
        save(); closeSheet(); renderAll(); showToast('Cuenta actualizada');
      } else {
        data.cuentasBanco = data.cuentasBanco || [];
        data.cuentasBanco.push({ nombre, saldoInicial, paraGastar });
        save(); closeSheet(); renderAll(); showToast('Cuenta agregada');
      }
    }
    function delCuentaBanco(nombre) {
      const cuenta = (data.cuentasBanco || []).find(c => c.nombre === nombre);
      if (!cuenta) return;
      const enUso = data.gastos.some(g => g.cuenta === nombre || g.cuentaReintegro === nombre)
        || data.ingresos.some(i => i.cuenta === nombre)
        || (data.transferencias || []).some(tr => tr.origen === nombre || tr.destino === nombre);
      if (!enUso && !cuenta.saldoInicial) {
        data.cuentasBanco = data.cuentasBanco.filter(c => c.nombre !== nombre);
        if (filtroGastos.cuenta === nombre) filtroGastos.cuenta = '';
        if (filtroIngresos.cuenta === nombre) filtroIngresos.cuenta = '';
        save(); renderAll(); showToast('Cuenta eliminada');
        return;
      }
      const saldoActual = computeCuentasBalances()[nombre] || 0;
      const otras = listaCuentas().filter(c => c !== nombre);
      openSheet('Esta cuenta tiene saldo o movimientos', `
    <p style="color:var(--ink-soft); font-size:14px; line-height:1.5; margin-top:-8px;">
      "${esc(nombre)}" tiene un saldo de ${money(saldoActual)}${enUso ? ' y movimientos registrados' : ''}. Elige a qué cuenta mover ese saldo e historial antes de eliminarla — nada se pierde, solo cambia de nombre.
    </p>
    <div class="field"><label>Mover todo a...</label>
      <select id="cuentaDestinoSelect" onchange="onCambioCuentaBancoDestino(this.value)">
        ${otras.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('')}
        <option value="__nueva__">+ Crear una cuenta nueva</option>
      </select>
    </div>
    <div class="field" id="cuentaDestinoNuevaWrap" style="display:none;">
      <label>Nombre de la nueva cuenta</label>
      <input type="text" id="cuentaDestinoNuevaInput" placeholder="Ej. Banco Agrícola">
    </div>
    <button class="btn" onclick="moverYEliminarCuentaBanco('${attrJs(nombre)}')">Mover saldo y eliminar cuenta</button>
    <button class="btn ghost" style="margin-top:8px;" onclick="closeSheet()">Cancelar</button>
  `);
    }
    function onCambioCuentaBancoDestino(val) {
      const wrap = document.getElementById('cuentaDestinoNuevaWrap');
      if (wrap) wrap.style.display = val === '__nueva__' ? 'block' : 'none';
    }
    function moverYEliminarCuentaBanco(nombre) {
      const sel = document.getElementById('cuentaDestinoSelect').value;
      let destino = sel;
      if (sel === '__nueva__') {
        destino = (document.getElementById('cuentaDestinoNuevaInput').value || '').trim();
        if (!destino) { showToast('Escribe un nombre para la nueva cuenta'); return; }

    function saveIngreso() {

    function renderMovimientos() {
      const periodoActual = data.ajustes.periodo || 'quincenal';

      let items = [...(data.transferencias || [])];

    <div class="tutorial-dots">${TUTORIAL_SLIDES.map((_, i) => `<span class="${i === tutorialPaso ? 'on' : ''}"></span>`).join('')}</div>
    <button class="btn" onclick="siguienteTutorial()">${esUltimo ? 'Empezar' : 'Siguiente'}</button>
    <div class="tutorial-nav">
      <button type="button" class="tutorial-link ${tutorialPaso === 0 ? 'hidden' : ''}" onclick="anteriorTutorial()">Atrás</button>
      <button type="button" class="tutorial-link ${esUltimo ? 'hidden' : ''}" onclick="cerrarTutorial()">Saltar</button>
    </div>
  `;
    }
    function siguienteTutorial() {
      if (tutorialPaso < TUTORIAL_SLIDES.length - 1) { tutorialPaso++; renderTutorial(); }
      else cerrarTutorial();
    }
    function anteriorTutorial() {
      if (tutorialPaso > 0) { tutorialPaso--; renderTutorial(); }
    }
    function cerrarTutorial() {
      document.getElementById('tutorialOverlay').classList.remove('show');
      desbloquearScroll();
      localStorage.setItem('bitacora_tutorial_visto', '1');
    }

    function renderAll() {
      renderResumen(); renderGastos(); renderIngresos(); renderMovimientos(); renderAjustes();
    }
    renderAll();
    switchView('resumen');
    if (!localStorage.getItem('bitacora_tutorial_visto')) {
      iniciarTutorial();
    }
  </script>
</body>

</html>
